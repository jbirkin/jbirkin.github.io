<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Merriweather&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/midnight.css' | relative_url }}">
    {% raw %}
    <script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']]
  },
  svg: {
    fontCache: 'global'
  }
};

    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    {% endraw %}
</head>
<body>
<section class="page-header">
    <h1>{{ page.title }}</h1>
    <h2>{{ page.author }}, {{ page.date | date: "%B %d, %Y" }}</h2>
</section>

<a href="{{ '/' | relative_url }}portfolio.html" class="floating-back-link">
  Back<br>to<br>Portfolio
</a>


<section class="main-content">
    <article>
<!--        <p><em>{{ page.date | date: "%B %d, %Y" }}</em></p>-->
        {{ content }}
    </article>
</section>
</body>
</html>
